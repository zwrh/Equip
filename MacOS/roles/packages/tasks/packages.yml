---
- name: Check whether Homebrew is available for command-line packages
  ansible.builtin.stat:
    path: "{{ equip_homebrew_executable }}"
  register: equip_packages_homebrew

- name: Require Homebrew before installing command-line packages
  ansible.builtin.assert:
    that:
      - equip_packages_homebrew.stat.exists
    fail_msg: >-
      Homebrew is required to install command-line packages. Run
      ansible-playbook site.yml --tags homebrew first.

- name: Check which command-line packages are installed
  ansible.builtin.command:
    argv:
      - "{{ equip_homebrew_executable }}"
      - list
      - --formula
      - "{{ item }}"
  loop: "{{ equip_packages }}"
  register: equip_packages_status
  changed_when: false
  failed_when: false

- name: Install missing command-line packages
  ansible.builtin.command:
    argv:
      - "{{ equip_homebrew_executable }}"
      - install
      - "{{ item.item }}"
  environment:
    HOMEBREW_NO_ANALYTICS: "1"
  loop: "{{ equip_packages_status.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.rc != 0
  changed_when: true

- name: Verify selected command-line packages
  ansible.builtin.command:
    argv:
      - "{{ equip_homebrew_executable }}"
      - list
      - --formula
      - "{{ item }}"
  loop: "{{ equip_packages }}"
  changed_when: false
